# Kdeploy configuration file
# This file is automatically loaded when running kdeploy commands

# Number of parallel task executions (default: 10)
parallel: 5

# SSH connection timeout in seconds (default: 30)
ssh_timeout: 60

# SSH host key verification: always | never | accept_new
# Library default: accept_new. This repo uses never for local/CI convenience.
verify_host_key: never
